<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/tenis-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- CAMBIO: la etiqueta <meta name="MTC Tennis" content="Madrid Tennis Weekly" />
         no es válida (name= debe ser un nombre reconocido, no el de tu app) y no hacía nada.
         La sustituyo por una meta description real, que sí usan buscadores y algunas
         vistas previas como texto de respaldo. -->
    <meta
      name="description"
      content="Madrid Tennis Weekly - organize matches and play tennis with your group."
    />

    <!-- CAMBIO: añadidas las etiquetas Open Graph que faltaban por completo.
         Sin og:image, WhatsApp no tiene imagen grande que mostrar y cae de vuelta
         al favicon (el "mini icono"). Con esto WhatsApp mostrará una tarjeta con
         título, descripción e imagen propios en vez del icono de React.
         IMPORTANTE: reemplaza TU-DOMINIO.com por tu dominio real de producción,
         y og:image debe ser una URL absoluta (https) a una imagen pública,
         idealmente 1200x630px. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MTC Tennis" />
    <meta
      property="og:description"
      content="Madrid Tennis Weekly - organize matches and play tennis with your group."
    />
    <meta property="og:image" content="https://TU-DOMINIO.com/tenis-logo.png" />
    <meta property="og:url" content="https://TU-DOMINIO.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/tenis-logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>MTC Tennis</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
